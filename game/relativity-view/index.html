<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相对论沉浸式可视化</title>
    <style>
        :root {
            --primary: #1a2a4a;
            --secondary: #2d3436;
            --accent: #00d4aa;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            min-height: 100vh;
            color: var(--text);
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 顶部面板 */
        .top-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(180deg, rgba(26, 42, 74, 0.95) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
        }

        .game-title {
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .speed-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .speed-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            min-width: 100px;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(26, 42, 74, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 12px;
            padding: 24px;
            z-index: 100;
            width: 200px;
        }

        .panel-title {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .speed-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 10px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .speed-btn:hover {
            background: rgba(0, 212, 170, 0.2);
        }

        .speed-btn.active {
            background: var(--accent);
            color: var(--primary);
            border-color: var(--accent);
        }

        .speed-btn .speed {
            float: right;
            opacity: 0.7;
        }

        /* 任务面板 */
        .task-panel {
            position: fixed;
            right: 20px;
            top: 90px;
            width: 260px;
            background: rgba(26, 42, 74, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--accent);
        }

        .task-checkbox.completed {
            background: var(--accent);
            color: var(--primary);
        }

        .task-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* 开始菜单 */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 42, 74, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .menu-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .menu-content h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--accent);
            margin-bottom: 16px;
            letter-spacing: 4px;
        }

        .menu-content p {
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 16px 32px;
            margin-bottom: 16px;
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .menu-btn.secondary {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
        }

        .menu-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        /* 场景信息 */
        .scene-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 42, 74, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 8px;
            padding: 12px 20px;
            z-index: 100;
        }

        .scene-info .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .scene-info .value {
            font-size: 1rem;
            color: var(--accent);
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 触屏控制提示 */
        @media (max-width: 768px) {
            .control-panel {
                left: 10px;
                width: 160px;
                padding: 16px;
            }

            .task-panel {
                right: 10px;
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 顶部面板 -->
    <div class="top-panel">
        <span class="game-title">🚀 相对论沉浸式可视化</span>
        <div class="speed-indicator">
            <span class="speed-label">当前速度</span>
            <span class="speed-value" id="speedDisplay">0 km/s</span>
        </div>
    </div>

    <!-- 左侧控制面板 -->
    <div class="control-panel">
        <div class="panel-title">速度模式</div>
        <button class="speed-btn" onclick="setSpeed(0.01)">
            🚶 低速行走 <span class="speed">~10 km/s</span>
        </button>
        <button class="speed-btn" onclick="setSpeed(0.5)">
            🚀 中速飞行 <span class="speed">150,000 km/s</span>
        </button>
        <button class="speed-btn active" onclick="setSpeed(0.99)">
            ⚡ 近光速 <span class="speed">297,000 km/s</span>
        </button>
    </div>

    <!-- 右侧任务面板 -->
    <div class="task-panel">
        <div class="panel-title">观测任务</div>
        <div class="task-item">
            <div class="task-checkbox" id="task1">✓</div>
            <span class="task-text" id="taskText1">观察光影畸变效应</span>
        </div>
        <div class="task-item">
            <div class="task-checkbox" id="task2">✓</div>
            <span class="task-text" id="taskText2">穿越一颗天体</span>
        </div>
        <div class="task-item">
            <div class="task-checkbox" id="task3">✓</div>
            <span class="task-text" id="taskText3">体验多普勒红移/蓝移</span>
        </div>
    </div>

    <!-- 底部场景信息 -->
    <div class="scene-info">
        <div class="label">当前场景</div>
        <div class="value" id="sceneName">星际空间</div>
    </div>

    <!-- 开始菜单 -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-content">
            <h1>相对论可视化</h1>
            <p>
                基于 MIT OpenRelativity 开源项目改造<br>
                体验接近光速运动时的视觉畸变效应<br>
                直观理解相对论中的时间膨胀与长度收缩
            </p>
            <button class="menu-btn" onclick="startGame()">开始体验</button>
            <button class="menu-btn" onclick="location.href='../../index.html'">返回首页</button>
        </div>
    </div>

    <script>
    /**
     * 本模块基于 GitHub MITGameLab/OpenRelativity 二次开发
     * 开源协议：MIT License
     * 用途：相对论物理可视化科研游戏
     */

    // ============ 全局变量 ============
    let scene, camera, renderer;
    let stars = [];
    let nebula = [];
    let celestialBodies = [];
    let currentSpeed = 0.01; // 光速的倍数
    let targetSpeed = 0.01;
    let clock = new THREE.Clock();
    let gameStarted = false;

    // 任务状态
    const tasks = {
        observeDistortion: false,
        passCelestial: false,
        dopplerEffect: false
    };

    // ============ 初始化 ============
    function init() {
        const container = document.getElementById('canvas-container');

        // 场景
        scene = new THREE.Scene();

        // 相机
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 0, 0);

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 创建星空
        createStars();

        // 创建星云背景
        createNebula();

        // 创建天体
        createCelestialBodies();

        // 键盘控制
        document.addEventListener('keydown', onKeyDown);

        // 触屏控制
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        document.addEventListener('touchmove', (e) => {
            if (!gameStarted) return;
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;
            camera.rotation.y += deltaX * 0.002;
            camera.rotation.x += deltaY * 0.002;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        // 响应式
        window.addEventListener('resize', onWindowResize);

        // 动画循环
        animate();
    }

    // ============ 创建场景元素 ============
    function createStars() {
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            const i3 = i * 3;
            // 分布在球形空间
            const radius = 500 + Math.random() * 2000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i3 + 2] = radius * Math.cos(phi);

            // 颜色 - 白色到淡蓝/淡红
            const colorChoice = Math.random();
            if (colorChoice < 0.7) {
                colors[i3] = 1; colors[i3 + 1] = 1; colors[i3 + 2] = 1;
            } else if (colorChoice < 0.85) {
                colors[i3] = 0.7; colors[i3 + 1] = 0.8; colors[i3 + 2] = 1; // 蓝移
            } else {
                colors[i3] = 1; colors[i3 + 1] = 0.7; colors[i3 + 2] = 0.6; // 红移
            }
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const starMaterial = new THREE.PointsMaterial({
            size: 2,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });

        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);
        stars.push(starField);
    }

    function createNebula() {
        // 星云效果 - 使用多层透明球体
        for (let i = 0; i < 8; i++) {
            const geometry = new THREE.SphereGeometry(100 + Math.random() * 200, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.5 + Math.random() * 0.2, 0.5, 0.1),
                transparent: true,
                opacity: 0.05 + Math.random() * 0.05,
                side: THREE.BackSide
            });
            const nebulaCloud = new THREE.Mesh(geometry, material);
            nebulaCloud.position.set(
                (Math.random() - 0.5) * 1000,
                (Math.random() - 0.5) * 1000,
                (Math.random() - 0.5) * 1000
            );
            scene.add(nebulaCloud);
            nebula.push(nebulaCloud);
        }
    }

    function createCelestialBodies() {
        // 创建一个行星
        const planetGeometry = new THREE.SphereGeometry(30, 64, 64);
        const planetMaterial = new THREE.MeshPhongMaterial({
            color: 0x4488ff,
            emissive: 0x001133,
            shininess: 20
        });
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.set(200, 50, -300);
        scene.add(planet);
        celestialBodies.push({ mesh: planet, type: 'planet', name: '蓝色行星' });

        // 添加行星环
        const ringGeometry = new THREE.RingGeometry(40, 60, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0xaaccff,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.position.copy(planet.position);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // 创建一个恒星
        const sunGeometry = new THREE.SphereGeometry(80, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            emissive: 0xffaa00
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(-500, 100, -800);
        scene.add(sun);
        celestialBodies.push({ mesh: sun, type: 'star', name: '红色恒星' });

        // 太阳光晕
        const glowGeometry = new THREE.SphereGeometry(100, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            transparent: true,
            opacity: 0.3
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        glow.position.copy(sun.position);
        scene.add(glow);
    }

    // ============ 控制函数 ============
    function setSpeed(speed) {
        targetSpeed = speed;
        currentSpeed = speed;

        // 更新显示
        const speedKmS = Math.round(speed * 299792);
        document.getElementById('speedDisplay').textContent = speedKmS.toLocaleString() + ' km/s';

        // 更新按钮状态
        document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
        event.target.closest('.speed-btn').classList.add('active');

        // 触发任务
        if (speed > 0.5 && !tasks.observeDistortion) {
            tasks.observeDistortion = true;
            completeTask(1);
        }
    }

    function completeTask(taskNum) {
        const checkbox = document.getElementById(`task${taskNum}`);
        const text = document.getElementById(`taskText${taskNum}`);
        checkbox.classList.add('completed');
        text.classList.add('completed');

        // 保存进度
        const allStats = JSON.parse(localStorage.getItem('scienceGameStats') || '{}');
        if (!allStats['relativity-view']) allStats['relativity-view'] = { playTime: 0, levelCompleted: 0, totalScore: 0, achievements: [] };
        allStats['relativity-view'].levelCompleted = Math.max(allStats['relativity-view'].levelCompleted || 0, taskNum);
        localStorage.setItem('scienceGameStats', JSON.stringify(allStats));
    }

    function onKeyDown(event) {
        if (!gameStarted) return;

        switch(event.key) {
            case 'ArrowUp':
            case 'w':
                camera.position.z -= 10;
                break;
            case 'ArrowDown':
            case 's':
                camera.position.z += 10;
                break;
            case 'ArrowLeft':
            case 'a':
                camera.position.x -= 10;
                break;
            case 'ArrowRight':
            case 'd':
                camera.position.x += 10;
                break;
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ============ 游戏控制 ============
    function startGame() {
        gameStarted = true;
        document.getElementById('menuOverlay').classList.add('hidden');
    }

    // ============ 动画循环 ============
    function animate() {
        requestAnimationFrame(animate);

        if (!gameStarted) {
            // 菜单状态下的自动旋转
            stars.forEach(star => {
                star.rotation.y += 0.0002;
            });
            renderer.render(scene, camera);
            return;
        }

        const delta = clock.getDelta();

        // 相对论性视觉畸变效果
        // 当速度接近光速时，星星会从前方向压缩（挤压效应）
        const lorentzFactor = 1 / Math.sqrt(1 - currentSpeed * currentSpeed);

        // 移动星空位置产生运动感
        stars.forEach(star => {
            star.position.z += currentSpeed * 50;
            if (star.position.z > 500) {
                star.position.z -= 2000;
            }

            // 速度越快，星星越向前压缩（模拟相对论光学畸变）
            const compression = 1 + currentSpeed * 2;
            star.scale.set(compression, compression, 1);
        });

        // 多普勒红移/蓝移效果
        nebula.forEach(cloud => {
            cloud.rotation.x += 0.001;
            cloud.rotation.y += 0.001;

            // 根据速度调整颜色
            const hue = cloud.material.color.getHSL({}).h;
            cloud.material.opacity = 0.05 + currentSpeed * 0.1;
        });

        // 检查天体穿越任务
        celestialBodies.forEach(body => {
            const distance = camera.position.distanceTo(body.mesh.position);
            if (distance < 100 && !tasks.passCelestial) {
                tasks.passCelestial = true;
                completeTask(2);
            }
        });

        // 检查速度达到近光速
        if (currentSpeed > 0.8 && !tasks.dopplerEffect) {
            tasks.dopplerEffect = true;
            completeTask(3);
        }

        // 更新游玩时间
        const allStats = JSON.parse(localStorage.getItem('scienceGameStats') || '{}');
        if (!allStats['relativity-view']) allStats['relativity-view'] = { playTime: 0, levelCompleted: 0, totalScore: 0, achievements: [] };
        allStats['relativity-view'].playTime = (allStats['relativity-view'].playTime || 0) + delta;
        localStorage.setItem('scienceGameStats', JSON.stringify(allStats));

        renderer.render(scene, camera);
    }

    // 初始化
    window.onload = init;
    </script>
</body>
</html>
