<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速轻量解谜</title>
    <style>
        :root {
            --primary: #1a2a4a;
            --secondary: #2d3436;
            --accent: #00d4aa;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* 顶部 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 题目卡片 */
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
        }

        .question-number {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .question-image {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }

        /* 选项 */
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-btn {
            padding: 16px 20px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: rgba(0, 212, 170, 0.2);
            border-color: var(--accent);
        }

        .option-btn.selected {
            background: var(--accent);
            color: var(--primary);
            border-color: var(--accent);
        }

        .option-btn.correct {
            background: var(--success);
            color: var(--primary);
            border-color: var(--success);
        }

        .option-btn.wrong {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }

        /* 进度条 */
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        /* 统计 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 按钮 */
        .action-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 212, 170, 0.3);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn.secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            margin-top: 12px;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        /* 结果页面 */
        .result-card {
            text-align: center;
            padding: 40px;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 12px;
        }

        .result-score {
            font-size: 3rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .result-detail {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* 拖拽题目 */
        .drag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .drag-item {
            padding: 12px 20px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s ease;
            user-select: none;
        }

        .drag-item:hover {
            background: rgba(0, 212, 170, 0.2);
            transform: scale(1.05);
        }

        .drag-item.dragging {
            opacity: 0.5;
        }

        .drop-zone {
            min-height: 60px;
            border: 2px dashed rgba(0, 212, 170, 0.3);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .drop-zone.active {
            border-color: var(--accent);
            background: rgba(0, 212, 170, 0.1);
        }

        .drop-zone .drag-item {
            background: var(--accent);
            color: var(--primary);
        }

        /* 返回链接 */
        .back-link {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent);
        }

        @media (max-width: 500px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>⚡ 极速轻量解谜</h1>
            <p>基于 OpenGame 框架 · 生物与物理知识挑战</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="currentQ">1</div>
                <div class="stat-label">当前题号</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">得分</div>
            </div>
        </div>

        <div id="questionArea">
            <!-- 题目将动态加载 -->
        </div>

        <div id="actionArea">
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
            <button class="action-btn secondary" onclick="location.href='../../index.html'">返回首页</button>
        </div>
    </div>

    <script>
    /**
     * 基于开源框架 leigest519/OpenGame 快速制作轻量科研解谜小游戏
     * 开源协议：MIT License
     * 用途：官网试玩板块，快速 Demo 生成
     */

    // ============ 题库 ============
    const QUESTIONS = [
        {
            type: 'choice',
            category: 'biology',
            question: '细胞中负责产生能量的结构是？',
            options: ['细胞核', '线粒体', '细胞膜', '核糖体'],
            answer: 1,
            explanation: '线粒体是细胞的"能量工厂"，通过呼吸作用产生 ATP'
        },
        {
            type: 'choice',
            category: 'physics',
            question: '光在真空中的传播速度约为？',
            options: ['3×10⁶ m/s', '3×10⁷ m/s', '3×10⁸ m/s', '3×10⁹ m/s'],
            answer: 2,
            explanation: '光速约为 299,792,458 m/s，通常简写为 3×10⁸ m/s'
        },
        {
            type: 'drag',
            category: 'biology',
            question: '将DNA复制过程按顺序排列：',
            items: ['解旋酶打开双链', 'DNA聚合酶合成新链', 'RNA引物结合', '连接酶连接片段'],
            order: [0, 2, 1, 3],
            explanation: 'DNA复制：解旋 →  RNA引物 → DNA聚合酶合成 → 连接酶连接'
        },
        {
            type: 'choice',
            category: 'physics',
            question: '相对论中，物体的质量与速度的关系是？',
            options: ['速度越大，质量越小', '速度越大，质量越大', '质量与速度无关', '质量与速度成正比'],
            answer: 1,
            explanation: '根据爱因斯坦的相对论，物体速度接近光速时，其相对论质量会增大'
        },
        {
            type: 'choice',
            category: 'biology',
            question: '人类基因组计划主要研究的是？',
            options: ['蛋白质结构', 'DNA序列', 'RNA转录', '细胞代谢'],
            answer: 1,
            explanation: '人类基因组计划旨在测定人类DNA的全部30亿个碱基序列'
        },
        {
            type: 'drag',
            category: 'physics',
            question: '将能量转换类型配对：',
            items: ['太阳能电池', '水力发电', '火力发电', '核电站'],
            targets: ['光能→电能', '机械能→电能', '化学能→电能', '核能→电能'],
            match: [0, 1, 2, 3],
            explanation: '不同发电方式涉及不同的能量转换过程'
        }
    ];

    // ============ 游戏状态 ============
    let currentQuestion = 0;
    let score = 0;
    let correctCount = 0;
    let selectedAnswer = null;
    let answered = false;

    // ============ 渲染题目 ============
    function renderQuestion() {
        const q = QUESTIONS[currentQuestion];
        const area = document.getElementById('questionArea');

        // 更新进度
        const progress = ((currentQuestion) / QUESTIONS.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('currentQ').textContent = currentQuestion + 1;

        let html = `
            <div class="question-card">
                <div class="question-number">${q.category === 'biology' ? '🧬 生物' : '⚛️ 物理'} · 第${currentQuestion + 1}题</div>
        `;

        if (q.type === 'choice') {
            html += `
                <div class="question-text">${q.question}</div>
                <div class="options">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectAnswer(${i})">${opt}</button>
                    `).join('')}
                </div>
            `;
        } else if (q.type === 'drag') {
            html += `
                <div class="question-text">${q.question}</div>
                <div class="drag-container" id="dragContainer">
                    ${q.items.map((item, i) => `
                        <div class="drag-item" draggable="true" data-index="${i}">${item}</div>
                    `).join('')}
                </div>
                <div class="drop-zone" id="dropZone"></div>
            `;
        }

        html += '</div>';
        area.innerHTML = html;

        // 设置拖拽事件
        if (q.type === 'drag') {
            setupDragAndDrop();
        }

        // 重置状态
        selectedAnswer = null;
        answered = false;
        document.getElementById('nextBtn').disabled = true;
    }

    // ============ 选择答案 ============
    function selectAnswer(index) {
        if (answered) return;

        selectedAnswer = index;
        const q = QUESTIONS[currentQuestion];
        const buttons = document.querySelectorAll('.option-btn');

        buttons.forEach((btn, i) => {
            btn.classList.remove('selected', 'correct', 'wrong');
            if (i === index) {
                btn.classList.add('selected');
            }
        });

        answered = true;

        // 标记正确/错误
        setTimeout(() => {
            if (index === q.answer) {
                buttons[index].classList.remove('selected');
                buttons[index].classList.add('correct');
                correctCount++;
                score += 20;
            } else {
                buttons[index].classList.remove('selected');
                buttons[index].classList.add('wrong');
                buttons[q.answer].classList.add('correct');
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('score').textContent = score;
            document.getElementById('nextBtn').disabled = false;
        }, 300);
    }

    // ============ 拖拽功能 ============
    function setupDragAndDrop() {
        const items = document.querySelectorAll('.drag-item');
        const dropZone = document.getElementById('dropZone');

        items.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.dataset.index);
                item.classList.add('dragging');
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
            });
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('active');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');

            const index = e.dataTransfer.getData('text/plain');
            const item = document.querySelector(`.drag-item[data-index="${index}"]`);

            if (item && !item.parentElement.classList.contains('drop-zone')) {
                dropZone.appendChild(item);

                // 检查是否全部放置
                const allPlaced = document.querySelectorAll('#dragContainer .drag-item').length === 0;
                if (allPlaced) {
                    checkDragAnswer();
                }
            }
        });
    }

    function checkDragAnswer() {
        if (answered) return;
        answered = true;

        const q = QUESTIONS[currentQuestion];
        const placedItems = document.querySelectorAll('#dropZone .drag-item');
        let correct = true;

        placedItems.forEach((item, i) => {
            if (parseInt(item.dataset.index) !== q.order[i]) {
                correct = false;
                item.style.borderColor = 'var(--error)';
            } else {
                item.style.borderColor = 'var(--success)';
            }
        });

        if (correct) {
            correctCount++;
            score += 20;
        }

        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('score').textContent = score;
        document.getElementById('nextBtn').disabled = false;
    }

    // ============ 下一题 ============
    function nextQuestion() {
        currentQuestion++;

        if (currentQuestion >= QUESTIONS.length) {
            showResult();
        } else {
            renderQuestion();
        }
    }

    // ============ 显示结果 ============
    function showResult() {
        const percent = Math.round((correctCount / QUESTIONS.length) * 100);
        let icon, title;

        if (percent >= 80) {
            icon = '🏆';
            title = '太棒了！';
        } else if (percent >= 60) {
            icon = '👍';
            title = '做得不错！';
        } else if (percent >= 40) {
            icon = '💪';
            title = '继续加油！';
        } else {
            icon = '📚';
            title = '再接再厉！';
        }

        document.getElementById('questionArea').innerHTML = `
            <div class="question-card result-card">
                <div class="result-icon">${icon}</div>
                <div class="result-title">${title}</div>
                <div class="result-score">${percent}%</div>
                <div class="result-detail">
                    正确 ${correctCount} / ${QUESTIONS.length} 题<br>
                    总得分：${score} 分
                </div>
            </div>
        `;

        document.getElementById('actionArea').innerHTML = `
            <button class="action-btn" onclick="restart()">再来一次</button>
            <button class="action-btn secondary" onclick="location.href='../../index.html'">返回首页</button>
        `;

        document.getElementById('progressFill').style.width = '100%';

        // 保存数据
        const allStats = JSON.parse(localStorage.getItem('scienceGameStats') || '{}');
        if (!allStats['quick-demo']) allStats['quick-demo'] = { playTime: 0, levelCompleted: 0, totalScore: 0, achievements: [] };
        allStats['quick-demo'].totalScore += score;
        allStats['quick-demo'].levelCompleted++;
        if (percent >= 80) {
            allStats['quick-demo'].achievements = allStats['quick-demo'].achievements || [];
            if (!allStats['quick-demo'].achievements.includes('quick-master')) {
                allStats['quick-demo'].achievements.push('quick-master');
            }
        }
        localStorage.setItem('scienceGameStats', JSON.stringify(allStats));
    }

    function restart() {
        currentQuestion = 0;
        score = 0;
        correctCount = 0;
        selectedAnswer = null;
        answered = false;

        document.getElementById('correctCount').textContent = '0';
        document.getElementById('score').textContent = '0';

        document.getElementById('actionArea').innerHTML = `
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
            <button class="action-btn secondary" onclick="location.href='../../index.html'">返回首页</button>
        `;

        renderQuestion();
    }

    // ============ 初始化 ============
    renderQuestion();
    </script>
</body>
</html>
