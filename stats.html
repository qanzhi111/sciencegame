<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学游戏 · 数据中心</title>
    <style>
        :root {
            --primary: #1a2a4a;
            --secondary: #0d1830;
            --accent: #00d4aa;
            --accent-glow: #00ffcc;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: rgba(255,255,255,0.05);
            --border: rgba(0,212,170,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 40px 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 36px; flex-wrap: wrap; gap: 16px;
        }
        h1 {
            font-size: 2rem; font-weight: 300; letter-spacing: 4px; color: var(--accent);
        }
        h1 .sub { color: var(--text-muted); font-size: 0.9rem; margin-left: 8px; letter-spacing: 1px; }

        .back-btn, .action-btn {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover, .action-btn:hover {
            background: var(--accent); color: var(--primary);
            box-shadow: 0 6px 20px rgba(0,212,170,0.25);
        }
        .action-btn.warn { border-color: #ef5350; color: #ef5350; }
        .action-btn.warn:hover { background: #ef5350; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            transition: transform 0.25s ease;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-value {
            font-size: 2.2rem; font-weight: 600; color: var(--accent);
            margin-bottom: 4px; text-shadow: 0 0 14px rgba(0,212,170,0.25);
        }
        .stat-label { color: var(--text-muted); font-size: 0.88rem; }

        .game-stats {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px 28px;
            margin-bottom: 20px;
        }
        .game-stats h2 {
            font-size: 1.1rem; font-weight: 500; margin-bottom: 18px; color: var(--accent);
            letter-spacing: 2px;
        }
        .game-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 20px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.9rem;
        }
        .game-item:last-child { border-bottom: none; }
        .game-item .name { color: var(--text); font-weight: 500; }
        .game-item .name .emoji { margin-right: 8px; }
        .game-item .detail { color: var(--text-muted); font-size: 0.85rem; text-align: right; }
        .game-item .detail strong { color: var(--accent); font-weight: 600; }

        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
        }
        .empty-state p { margin-bottom: 20px; }
        .empty-state .emoji { font-size: 3rem; margin-bottom: 14px; display: block; }

        .achievement-list {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-top: 6px;
        }
        .achievement {
            padding: 4px 10px;
            background: rgba(0,212,170,0.1);
            border: 1px solid rgba(0,212,170,0.3);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--accent);
        }

        @media (max-width: 720px) {
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            .game-item { grid-template-columns: 1fr; gap: 6px; }
            .game-item .detail { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 游戏数据中心<span class="sub">STATS · 本地 localStorage</span></h1>
            <div style="display:flex; gap: 10px;">
                <button class="action-btn warn" onclick="clearAll()">🗑 清空数据</button>
                <button class="back-btn" onclick="location.href='index.html'">← 返回首页</button>
            </div>
        </header>

        <div class="stats-grid" id="totalsGrid"></div>
        <div class="game-stats">
            <h2>各游戏详细数据</h2>
            <div id="gameList"></div>
        </div>
    </div>

    <script>
        const GAME_META = {
            'fold-protein':      { name: '蛋白质折叠解谜', emoji: '🧬', color: '#00d4aa' },
            'relativity-view':   { name: '相对论沉浸可视化', emoji: '🚀', color: '#00d4aa' },
            'quick-demo':        { name: '极速轻量解谜', emoji: '⚡', color: '#00d4aa' },
            'extend-puzzle':     { name: '逻辑几何解谜', emoji: '🧩', color: '#00d4aa' },
            'common/data-view':  { name: '3D 数据可视化', emoji: '📊', color: '#00d4aa' }
        };

        function formatTime(seconds) {
            const s = Math.floor(seconds || 0);
            if (s < 60) return s + ' 秒';
            if (s < 3600) return Math.floor(s / 60) + ' 分钟';
            return (s / 3600).toFixed(1) + ' 小时';
        }

        function loadStats() {
            const allStats = JSON.parse(localStorage.getItem('scienceGameStats') || '{}');
            let totalTime = 0, totalLevels = 0, totalScore = 0, totalAch = 0;
            const keys = Object.keys(allStats);

            if (keys.length === 0) {
                document.getElementById('gameList').innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">🎮</span>
                        <p>还没有游戏记录，快去玩一把吧！</p>
                        <button class="back-btn" onclick="location.href='index.html'">开始游戏</button>
                    </div>`;
                document.getElementById('totalsGrid').innerHTML = `
                    ${['总游玩时长', '完成关卡', '总得分', '获得成就'].map(label =>
                        `<div class="stat-card"><div class="stat-value">0</div><div class="stat-label">${label}</div></div>`
                    ).join('')}`;
                return;
            }

            let html = '';
            keys.forEach(key => {
                const s = allStats[key];
                const meta = GAME_META[key] || { name: key, emoji: '🎮' };
                const level = s.levelCompleted || 0;
                const score = s.totalScore || 0;
                const time = s.playTime || 0;
                const achs = s.achievements || [];
                totalTime += time; totalLevels += level; totalScore += score; totalAch += achs.length;

                const achHtml = achs.length ?
                    `<div class="achievement-list">${achs.map(a => `<span class="achievement">🏆 ${a}</span>`).join('')}</div>` :
                    '';

                html += `
                    <div class="game-item">
                        <div class="name"><span class="emoji">${meta.emoji}</span>${meta.name}</div>
                        <div class="detail">⏱ ${formatTime(time)}</div>
                        <div class="detail">🎯 <strong>${level}</strong> 关</div>
                        <div class="detail">⭐ <strong>${score}</strong> 分</div>
                        ${achHtml ? `<div style="grid-column: 1 / -1;">${achHtml}</div>` : ''}
                    </div>`;
            });
            document.getElementById('gameList').innerHTML = html;

            document.getElementById('totalsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-value">${formatTime(totalTime)}</div><div class="stat-label">总游玩时长</div></div>
                <div class="stat-card"><div class="stat-value">${totalLevels}</div><div class="stat-label">完成关卡数</div></div>
                <div class="stat-card"><div class="stat-value">${totalScore}</div><div class="stat-label">总得分</div></div>
                <div class="stat-card"><div class="stat-value">${totalAch}</div><div class="stat-label">获得成就</div></div>
            `;
        }

        function clearAll() {
            if (confirm('确认清空所有游戏数据？此操作不可撤销。')) {
                localStorage.removeItem('scienceGameStats');
                // 同时清理各游戏自定义存储
                Object.keys(localStorage).filter(k =>
                    k.startsWith('best_fold_') ||
                    k.startsWith('cleared_fold_') ||
                    k.startsWith('unlock_fold_') ||
                    k.startsWith('fold_guide_')
                ).forEach(k => localStorage.removeItem(k));
                loadStats();
                alert('数据已清空 ✓');
            }
        }

        loadStats();
    </script>
</body>
</html>
