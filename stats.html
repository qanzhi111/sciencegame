<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏数据统计</title>
    <style>
        :root {
            --primary: #1a2a4a;
            --secondary: #2d3436;
            --accent: #00d4aa;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
        }

        .back-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .game-stats {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }

        .game-stats h2 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .game-item:last-child {
            border-bottom: none;
        }

        .game-name {
            font-size: 1rem;
        }

        .game-detail {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 游戏数据中心</h1>
            <button class="back-btn" onclick="location.href='index.html'">返回首页</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalPlayTime">0</div>
                <div class="stat-label">总游玩时长 (分钟)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="levelsCompleted">0</div>
                <div class="stat-label">完成关卡数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalScore">0</div>
                <div class="stat-label">总得分</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="achievements">0</div>
                <div class="stat-label">获得成就</div>
            </div>
        </div>

        <div class="game-stats">
            <h2>各游戏详细数据</h2>
            <div id="gameList">
                <div class="empty-state">
                    <p>暂无游戏记录</p>
                    <button class="back-btn" onclick="location.href='index.html'">开始游戏</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 数据接口定义（预留）
        // interface GameStats {
        //   playTime: number;
        //   levelCompleted: number;
        //   totalScore: number;
        //   achievements: string[];
        // }

        // interface ReportPayload {
        //   gameId: string;
        //   stats: GameStats;
        //   timestamp: number;
        // }

        // function reportGameStats(payload: ReportPayload): void {
        //   // 预留接口 - 同步至官网数据看板
        // }

        // function unlockAchievement(achievementId: string): void {
        //   // 预留接口 - NFT 成就调用
        // }

        // function awardGameToken(amount: number): void {
        //   // 预留接口 - 代币奖励调用
        // }

        function loadStats() {
            const allStats = JSON.parse(localStorage.getItem('scienceGameStats') || '{}');

            let totalPlayTime = 0;
            let totalLevels = 0;
            let totalScore = 0;
            let totalAchievements = 0;

            const gameNames = {
                'fold-protein': '蛋白质折叠解谜',
                'relativity-view': '相对论沉浸可视化',
                'quick-demo': '极速轻量解谜',
                'extend-puzzle': '逻辑几何解谜'
            };

            let html = '';
            for (const [gameId, stats] of Object.entries(allStats)) {
                const name = gameNames[gameId] || gameId;
                totalPlayTime += (stats.playTime || 0);
                totalLevels += (stats.levelCompleted || 0);
                totalScore += (stats.totalScore || 0);
                totalAchievements += (stats.achievements?.length || 0);

                html += `
                    <div class="game-item">
                        <span class="game-name">${name}</span>
                        <span class="game-detail">
                            ${Math.round((stats.playTime || 0) / 60)}分钟 |
                            ${stats.levelCompleted || 0}关 |
                            ${stats.totalScore || 0}分
                        </span>
                    </div>
                `;
            }

            if (html) {
                document.getElementById('gameList').innerHTML = html;
            }

            document.getElementById('totalPlayTime').textContent = Math.round(totalPlayTime / 60);
            document.getElementById('levelsCompleted').textContent = totalLevels;
            document.getElementById('totalScore').textContent = totalScore;
            document.getElementById('achievements').textContent = totalAchievements;
        }

        loadStats();
    </script>
</body>
</html>
